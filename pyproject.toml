[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carro"
version = "0.1.0"
description = "Technician repair-order CLI + optional home-lab archive (PDF, photos, OBD)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "rich>=13.0",
  "reportlab>=4.0",
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
  "qrcode>=7.4",
  "Pillow>=10.0",
  "textual>=0.80",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
carro = "carro.app:main"

[tool.setuptools.packages.find]
where = ["cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["cli", "server"]
